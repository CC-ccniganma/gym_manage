<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="coachCommon::common-header"></head>
<body class="sb-nav-fixed">
<nav th:replace="coachCommon::common-navbar"></nav>
<div id="layoutSidenav">
    <div th:replace="coachCommon::common-sidenav"></div>

    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">健身计划管理</h1>

                <ol class="breadcrumb mb-4">
                    <li class="breadcrumb-item"><a th:href="@{/toCoachMain}">主页</a></li>
                    <li class="breadcrumb-item active">健身计划</li>
                </ol>

                <!-- 显示错误或成功消息 -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- 健身计划列表 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <i class="fas fa-clipboard-list me-1"></i>
                        我创建的健身计划
                    </div>
                    <div class="card-body">
                        <table id="datatablesSimple" class="table table-bordered">
                            <thead>
                            <tr>
                                <th>会员账号</th>
                                <th>会员姓名</th>
                                <th>健身计划内容</th>
                                <th>操作</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="plan:${planList}" th:if="${planList != null && !planList.isEmpty()}">
                                <td th:text="${plan.memberAccount}">会员账号</td>
                                <td th:text="${plan.memberName}">会员姓名</td>
                                <td th:text="${plan.message}">健身计划内容</td>
                                <td>
                                    <a th:href="@{/coach/toEditPlan/{memberAccount}(memberAccount=${plan.memberAccount})}" 
                                       class="btn btn-primary btn-sm">
                                        编辑
                                    </a>
                                    <a th:href="@{/coach/deletePlan/{memberAccount}(memberAccount=${plan.memberAccount})}" 
                                       class="btn btn-danger btn-sm"
                                       onclick="return confirm('确定要删除此健身计划吗？')">
                                        删除
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${planList == null || planList.isEmpty()}">
                                <td colspan="4" class="text-center">暂无健身计划</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                
                <!-- 添加健身计划按钮 -->
                <div style="text-align:center;margin-top:20px;margin-bottom:20px">
                    <a th:href="@{/coach/toAddPlan}">
                        <input type="button" class="btn btn-outline-success" value="添加健身计划">
                    </a>
                </div>
            </div>
        </main>
        <footer th:replace="coachCommon::common-footer"></footer>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="/static/js/scripts.js" th:src="@{/js/scripts.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/simple-datatables@latest" crossorigin="anonymous"></script>
<script src="/static/js/datatables-simple-demo.js" th:src="@{/js/datatables-simple-demo.js}"></script>
</body>
</html>
