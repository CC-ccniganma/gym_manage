<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="coachCommon::common-header"></head>
<body class="sb-nav-fixed">
<nav th:replace="coachCommon::common-navbar"></nav>
<div id="layoutSidenav">
    <div th:replace="coachCommon::common-sidenav"></div>

    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">添加健身计划</h1>

                <ol class="breadcrumb mb-4">
                    <li class="breadcrumb-item"><a th:href="@{/toCoachMain}">主页</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/coach/toPlan}">健身计划</a></li>
                    <li class="breadcrumb-item active">添加健身计划</li>
                </ol>

                <!-- 添加健身计划表单 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <i class="fas fa-plus-circle me-1"></i>
                        创建新的健身计划
                    </div>
                    <div class="card-body">
                        <form th:action="@{/coach/addPlan}" method="post" id="addPlanForm">
                            <div class="mb-3">
                                <label for="memberAccount" class="form-label">会员账号</label>
                                <input type="number" class="form-control" id="memberAccount" name="memberAccount" required
                                       placeholder="请输入会员账号">
                                <div class="form-text">请输入需要制定健身计划的会员账号</div>
                            </div>
                            <div class="mb-3">
                                <label for="message" class="form-label">健身计划内容</label>
                                <textarea class="form-control" id="message" name="message" rows="6" required
                                          placeholder="请输入健身计划内容..."></textarea>
                            </div>
                            <div class="text-center">
                                <button type="submit" class="btn btn-primary">提交</button>
                                <a th:href="@{/coach/toPlan}" class="btn btn-secondary">返回</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="coachCommon::common-footer"></footer>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="/static/js/scripts.js" th:src="@{/js/scripts.js}"></script>
</body>
</html>
