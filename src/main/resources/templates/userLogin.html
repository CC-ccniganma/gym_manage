<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content="gym-management-system"/>
    <meta name="author" content="MiloTnT"/>
    <title>健身房管理系统-会员登录</title>
    <link href="/static/css/styles.css" th:href="@{css/styles.css}" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js"
            crossorigin="anonymous"></script>
    <script type="text/javascript">
        function checkSubmit(loginForm) {
            if (loginForm.memberAccount.value == '') {
                alert("请输入账号");
                loginForm.memberAccount.focus();
                return false;
            }
            if (loginForm.memberPassword.value == '') {
                alert("请输入密码");
                loginForm.memberPassword.focus();
                return false;
            }
            return true;
        }

        function checkRegister(registerForm) {
            if (registerForm.memberAccount.value == '') {
                alert("请输入账号");
                registerForm.memberAccount.focus();
                return false;
            }
            if (registerForm.memberPassword.value == '') {
                alert("请输入密码");
                registerForm.memberPassword.focus();
                return false;
            }
            if (registerForm.confirmPassword.value == '') {
                alert("请确认密码");
                registerForm.confirmPassword.focus();
                return false;
            }
            if (registerForm.memberPassword.value != registerForm.confirmPassword.value) {
                alert("两次输入的密码不一致");
                return false;
            }
            return true;
        }
    </script>
</head>
<body class="bg-primary" th:style="'background-image: url(/img/background.jpeg);background-size: 100%, 100%'">
<div id="layoutAuthentication">
    <div id="layoutAuthentication_content">
        <main>
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-5">
                        <div class="card shadow-lg border-0 rounded-lg mt-5">
                            <div class="card-header">
                                <ul class="nav nav-tabs card-header-tabs">
                                    <li class="nav-item">
                                        <a class="nav-link active" id="login-tab" data-bs-toggle="tab" href="#login">登录</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link" id="register-tab" data-bs-toggle="tab" href="#register">注册</a>
                                    </li>
                                </ul>
                            </div>
                            <div class="card-body">
                                <div class="tab-content">
                                    <!-- 登录表单 -->
                                    <div class="tab-pane fade show active" id="login">
                                        <form th:action="@{/userLogin}" method="post" name="loginForm"
                                              onsubmit="return checkSubmit(this)">
                                            <div class="form-floating mb-3">
                                                <input class="form-control" id="inputAccount" name="memberAccount" type="account"
                                                       placeholder="Account"
                                                       onkeypress="return event.keyCode>=48&&event.keyCode<=57"/>
                                                <label for="inputAccount">账号</label>
                                            </div>
                                            <div class="form-floating mb-3">
                                                <input class="form-control" id="inputPassword" name="memberPassword"
                                                       type="password"
                                                       placeholder="Password"/>
                                                <label for="inputPassword">密码</label>
                                            </div>
                                            <div class="form-check mb-3">
                                                <input class="form-check-input" id="inputRememberPassword" type="checkbox"
                                                       value=""/>
                                                <label class="form-check-label" for="inputRememberPassword">记住密码</label>
                                            </div>
                                            <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                                                <div>
                                                    <input type="submit" class="btn btn-success" value="登录">
                                                </div>
                                                <div>
                                                    <a class="btn btn-primary me-2" th:href="@{/toCoachLogin}">转到教练登录</a>
                                                    <a class="btn btn-primary" th:href="@{/}">转到管理员登录</a>
                                                </div>
                                            </div>
                                        </form>
                                    </div>
                                    
                                    <!-- 注册表单 -->
                                    <div class="tab-pane fade" id="register">
                                        <form th:action="@{/register}" method="post" name="registerForm"
                                              onsubmit="return checkRegister(this)">
                                            <div class="form-floating mb-3">
                                                <input class="form-control" id="registerAccount" name="memberAccount" type="account"
                                                       placeholder="Account"
                                                       maxlength="9"
                                                       pattern="[0-9]{1,9}"
                                                       onkeypress="return event.keyCode>=48&&event.keyCode<=57"/>
                                                <label for="registerAccount">账号</label>
                                            </div>
                                            <div class="form-floating mb-3">
                                                <input class="form-control" id="registerPassword" name="memberPassword"
                                                       type="password"
                                                       placeholder="Password"/>
                                                <label for="registerPassword">密码</label>
                                            </div>
                                            <div class="form-floating mb-3">
                                                <input class="form-control" id="confirmPassword" name="confirmPassword"
                                                       type="password"
                                                       placeholder="Confirm Password"/>
                                                <label for="confirmPassword">确认密码</label>
                                            </div>
                                            <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                                                <div>
                                                    <input type="submit" class="btn btn-success" value="注册">
                                                </div>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                                <div th:text="${msg}" style="margin-top: 20px;text-align: center;color: red"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
